name: Quality
on:
  push:
    branches: ["feat/redline-rebirth", "main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run build
